apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: toggle-prod
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      serviceAccountName: analytics-service
      containers:
        - name: analytics-service
          image: 576394965690.dkr.ecr.us-east-1.amazonaws.com/analytics-service:sha-8ef9ded
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "analytics-service"
          envFrom:
            - configMapRef:
                name: analytics-config
            - secretRef:
                name: analytics-runtime-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 10
