
apiVersion: 1

groups:
  - orgId: 1
    name: self-healing
    folder: Self-Healing
    interval: 30s

    rules:
      - uid: erro500
        title: erro500
        condition: B
        for: 1m
        keepFiringFor: 0s
        noDataState: NoData
        execErrState: Error

        labels:
          severity: critical
          action: restart

        annotations:
          summary: HTTP 500 persistente no {{ $labels.job }}
          description: O serviço {{ $labels.job }} apresentou HTTP 500 por pelo menos 1 minuto.


        notification_settings:
          receiver: self-healing-webhook
          group_by:
            - alertname
            - job
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 24h

        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                sum by (job) (
                  increase(
                    http_server_duration_milliseconds_count{
                      http_status_code="500"
                    }[1m]
                  )
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 60
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  type: query

