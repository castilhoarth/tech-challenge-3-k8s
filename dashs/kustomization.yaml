apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

configMapGenerator:
  - name: grafana-dashboards
    files:
      - togglemaster-observability.json
      - Dashboard-AppServices.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "ToggleMaster"
      disableNameSuffixHash: true